<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bifardo · Administrador de pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8364C; --red-dark:#A52A3D; --bg:#ECEEF1; --card:#fff; --ink:#111; --muted:#6b6f76; --line:#e3e5e9;
    --s-pend:#9aa0a6; --s-conf:#F08A5D; --s-prep:#3BAA6E; --s-entr:#4A7BD0; --s-ok:#2E8B83; --s-canc:#b9b9b9;
    color-scheme: light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Outfit",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .hidden{display:none!important}

  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:340px;text-align:center}
  .login-card img{width:72px;height:72px;border-radius:50%}
  .login-card h1{font-size:20px;margin:10px 0 2px}
  .login-card p{color:var(--muted);font-size:14px;margin-bottom:16px}
  .in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:18px;text-align:center;letter-spacing:4px;outline:none}
  .in:focus{border-color:var(--red)}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--red);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
  .login-card .btn{width:100%;margin-top:12px;font-size:16px}
  .err{color:var(--red-dark);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}

  /* top bar */
  header{background:var(--red);color:#fff;position:sticky;top:0;z-index:10}
  .hd{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hd img{width:38px;height:38px;border-radius:50%;background:#fff}
  .hd h1{font-size:18px;font-weight:700;margin-right:auto;line-height:1.1}
  .hd h1 small{display:block;font-size:12px;font-weight:500;opacity:.85}
  .stat{background:rgba(255,255,255,.16);border-radius:10px;padding:6px 12px;font-size:13px;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat b{display:block;font-size:17px}
  .hd .btn{background:#fff;color:var(--red-dark);text-decoration:none}
  .hd .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
  .live{font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
  .live i{width:8px;height:8px;border-radius:50%;background:#7CFFB2;display:inline-block}
  .live.off i{background:#FFD36B}

  /* tabs */
  .bar2{max-width:1400px;margin:0 auto;padding:14px 16px 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tab{border:0;background:#fff;border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
  .tab.on{background:var(--ink);color:#fff}
  .bar2 .sp{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
  .bar2 label{display:flex;gap:6px;align-items:center;cursor:pointer}

  /* cards */
  #list{max-width:1400px;margin:0 auto;padding:10px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
  .card{background:#fff;border-radius:16px;padding:14px;border-left:6px solid var(--s-pend);display:flex;flex-direction:column;gap:10px}
  .card.nuevo{animation:pulse 1.2s ease-in-out 4}
  @keyframes pulse{50%{box-shadow:0 0 0 4px rgba(200,54,76,.35)}}
  @media (prefers-reduced-motion: reduce){.card.nuevo{animation:none;box-shadow:0 0 0 3px rgba(200,54,76,.35)}}
  .c-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .c-num{font-weight:800;font-size:18px}
  .c-num small{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px;letter-spacing:1px}
  .c-time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
  .c-name{font-weight:600;font-size:16px}
  .c-phone{color:var(--muted);font-size:13px}
  .chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#f1f2f4;color:#444;margin-right:4px;text-transform:uppercase;letter-spacing:.5px}
  .chip.deli{background:#e8effc;color:#2f5fb3}
  .chip.take{background:#eaf6ef;color:#23794b}
  .chip.most{background:#fff1f3;color:var(--red-dark)}
  .chip.py{background:#E4002B;color:#fff}
  .chip.rp{background:#FF441F;color:#fff}
  .hd .btn.py{background:#E4002B;color:#fff}
  .hd .btn.rp{background:#FF441F;color:#fff}

  /* vistas: Pedidos / Menú */
  .vtabs{display:flex;gap:4px;background:rgba(255,255,255,.16);border-radius:12px;padding:3px}
  .vtab{border:0;background:transparent;color:#fff;font-weight:700;font-size:14px;padding:7px 14px;border-radius:9px}
  .vtab.on{background:#fff;color:var(--red-dark)}

  /* editor de menú */
  #menuView{max-width:1400px;margin:0 auto;padding:12px 16px 120px}
  .me-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .me-bar input[type=search]{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-width:220px;background:#fff}
  .me-help{font-size:13px;color:var(--muted);margin:0 2px 12px;max-width:80ch;line-height:1.45}
  .me-cat{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px}
  .me-cat h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--red);margin:2px 0 8px}
  .me-head,.me-row{display:grid;grid-template-columns:minmax(200px,2.4fr) repeat(4,minmax(86px,1fr)) 78px 78px 34px;gap:8px;align-items:center}
  .me-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:0 0 6px;border-bottom:1px solid var(--line)}
  .me-row{padding:7px 0;border-bottom:1px solid var(--line)}
  .me-row:last-of-type{border-bottom:0}
  .me-row.oculto{opacity:.5}
  .me-row.cambiado{background:#fffbea}
  .me-row input[type=text],.me-row input[type=number],.me-more textarea,.me-more select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;font-variant-numeric:tabular-nums;background:#fff}
  .me-row input:focus,.me-more textarea:focus{outline:none;border-color:var(--red)}
  .me-row input::placeholder{color:#b3b6bc}
  .sw{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;justify-content:center}
  .sw input{appearance:none;width:36px;height:20px;border-radius:99px;background:#d5d8dd;position:relative;cursor:pointer;flex:none}
  .sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .sw input:checked{background:var(--s-prep)}
  .sw input.stock:checked{background:var(--red)}
  .sw input:checked::after{left:18px}
  .me-x{border:0;background:#f1f2f4;border-radius:8px;width:30px;height:30px;font-size:14px}
  .me-more{grid-column:1/-1;display:grid;grid-template-columns:3fr 1fr;gap:8px;padding:4px 0 2px}
  .me-add{margin-top:8px;border:1.5px dashed var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:flex-end;z-index:20}
  .savebar span{margin-right:auto;font-size:14px;color:var(--muted)}
  .savebar .btn[disabled]{opacity:.45;cursor:default}
  @media (max-width:900px){
    .me-head{display:none}
    .me-row{grid-template-columns:1fr 1fr 1fr;row-gap:6px}
    .me-row > :first-child{grid-column:1/-1}
    .me-row [data-lbl]::before{content:attr(data-lbl);display:block;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
  }
  .c-addr{font-size:14px;line-height:1.35}
  .c-items{font-size:14px;line-height:1.4;border-top:1px dashed var(--line);padding-top:8px}
  .c-items .mod{color:var(--muted);font-size:12.5px;padding-left:14px}
  .c-notes{background:#fff8e6;border-radius:8px;padding:6px 8px;font-size:13px}
  .c-tot{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
  .c-tot b{font-size:18px}
  .c-tot span{color:var(--muted);font-size:13px}
  .c-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .estado{border:0;border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px;color:#fff;background:var(--s-pend);appearance:none;cursor:pointer}
  .pago{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-weight:600;font-size:13px}
  .pago.si{background:#eaf6ef;border-color:#3BAA6E;color:#23794b}
  .print{margin-left:auto;display:flex;gap:6px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
  .modal .box{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:20px}
  .modal h2{font-size:20px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .row.big{font-weight:800;font-size:18px;border-bottom:2px solid var(--ink)}
  .sel{display:flex;gap:8px;margin-bottom:12px}
  .sel input,.sel select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
  .modal .acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
  pre.res{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f6f7f9;border-radius:10px;padding:10px;margin-top:10px}

  /* ticket de impresión 80 mm */
  #print{display:none}
  @media print{
    @page{size:80mm auto;margin:0}
    body{background:#fff}
    body > *:not(#print){display:none!important}
    #print{display:block;width:72mm;margin:0 auto;padding:2mm 0 6mm;font-family:"Courier New",ui-monospace,monospace;color:#000}
  }
  .tk{font-size:12px;line-height:1.3}
  .tk h3{font-size:20px;text-align:center;margin:0 0 1mm}
  .tk .c{text-align:center}
  .tk hr{border:0;border-top:1px dashed #000;margin:2mm 0}
  .tk .it{font-size:15px;font-weight:700;margin-top:1.5mm}
  .tk .md{font-size:13px;padding-left:4mm}
  .tk .r{display:flex;justify-content:space-between}
  .tk .xl{font-size:22px;font-weight:800;text-align:center;letter-spacing:1px}
  .tk .nota{border:1px solid #000;padding:1mm 2mm;margin-top:2mm;font-size:13px;font-weight:700}
</style>
</head>

    </div>
  </section>
</div>

<!-- RESUMEN -->
<div class="modal hidden" id="mRes" role="dialog" aria-label="Resumen del turno">
  <div class="box">
    <h2>Resumen del turno</h2>
    <div class="sel">
      <input type="date" id="rDia" aria-label="Día">
      <select id="rTurno" aria-label="Turno"><option value="noche">Noche</option><option value="mediodia">Mediodía</option><option value="todo">Todo el día</option></select>
    </div>
    <div id="rBody"></div>
    <pre class="res" id="rTxt"></pre>
    <div class="acts">
      <button class="btn ghost sm" id="rCopy">Copiar resumen</button>
      <button class="btn sm" id="rClose">Cerrar</button>
    </div>
  </div>
</div>

<div id="print"></div>

<script src="menu.js?v=5"></script>
<script src="api.js?v=5"></script>
<script>
const $ = s => document.querySelector(s);
const ESTADOS = [["Pendiente","--s-pend"],["Confirmado","--s-conf"],["En Preparación","--s-prep"],["En Entrega","--s-entr"],["Entregado","--s-ok"],["Cancelado","--s-canc"]];
const color = e => `var(${(ESTADOS.find(x=>x[0]===e)||ESTADOS[0])[1]})`;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hora = iso => new Date(iso).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false});
const diaKey = d => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
// el "día de trabajo" termina a las 5 am: un pedido de la 1 am cuenta para la noche anterior
const diaTrabajo = iso => { const d = new Date(iso); if (d.getHours() < 5) d.setDate(d.getDate()-1); return diaKey(d); };

document.querySelectorAll(".suc").forEach(e=>e.textContent = CONFIG.SUCURSAL);

let PIN = "";
let pedidos = [];
let vistos = new Set();
let primera = true;
let filtro = "activos";
let audio = null;

/* ---------- login ---------- */
try { PIN = localStorage.getItem("bifa_admin_pin") || ""; } catch(e){}
$("#pin").value = PIN;
async function entrar(){
  PIN = $("#pin").value.trim();
  $("#loginErr").textContent = "";
  try { audio = audio || new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  try {
    const r = await Api.verificar(PIN);
    if (!r.ok) { $("#loginErr").textContent = r.error || "PIN incorrecto"; return; }
  } catch(e) { $("#loginErr").textContent = "No se pudo conectar con la base de pedidos."; return; }
  try { localStorage.setItem("bifa_admin_pin", PIN); } catch(e){}
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  cargar(); setInterval(cargar, 8000);
}
$("#entrar").onclick = entrar;
$("#pin").addEventListener("keydown", e=>{ if (e.key==="Enter") entrar(); });

/* ---------- sonido de pedido nuevo ---------- */
function beep(){
  if (!$("#sonido").checked || !audio) return;
  try {
    audio.resume();
    [0, .22, .44].forEach((t,i)=>{
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = i===2 ? 1320 : 880; o.type = "sine";
      g.gain.setValueAtTime(.0001, audio.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.4, audio.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime+t+.18);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime+t); o.stop(audio.currentTime+t+.2);
    });
  } catch(e){}
}

/* ---------- carga periódica ---------- */
async function cargar(){
  try {
    const r = await Api.listar(PIN, 60);
    if (!r.ok) throw new Error(r.error);
    const nuevos = r.pedidos.filter(p=>!vistos.has(p.codigo));
    // conservar cambios locales que todavía no confirmó el servidor
    r.pedidos.forEach(p=>{ const loc = pendientes[p.codigo]; if (loc) Object.assign(p, loc); });
    pedidos = r.pedidos;
    nuevos.forEach(p=>vistos.add(p.codigo));
    if (!primera && nuevos.length) {
      beep();
      parpadear(nuevos.length);
      if ($("#autoPrint").checked) nuevos.forEach((p,i)=>setTimeout(()=>imprimir(p,"cocina"), i*1500));
    }
    render(primera ? [] : nuevos.map(p=>p.codigo));
    primera = false;
    $("#live").classList.remove("off");
    $("#live span").textContent = "En vivo · " + hora(new Date().toISOString());
  } catch(e) {
    $("#live").classList.add("off");
    $("#live span").textContent = "Sin conexión, reintentando…";
  }
}
let tituloTimer = null;
function parpadear(n){
  clearInterval(tituloTimer); let on = false, k = 0;
  tituloTimer = setInterval(()=>{ document.title = (on = !on) ? `(${n}) ¡Pedido nuevo!` : "Bifardo · Administrador de pedidos"; if (++k > 20) { clearInterval(tituloTimer); document.title = "Bifardo · Administrador de pedidos"; } }, 700);
}

/* ---------- vista ---------- */
function hoyKey(){ return diaTrabajo(new Date().toISOString()); }
function ayerKey(){ const d = new Date(); if (d.getHours()<5) d.setDate(d.getDate()-1); d.setDate(d.getDate()-1); return diaKey(d); }
function visibles(){
  const hoy = hoyKey();
  if (filtro==="activos") return pedidos.filter(p=>!["Entregado","Cancelado"].includes(p.estado));
  if (filtro==="hoy") return pedidos.filter(p=>diaTrabajo(p.fecha)===hoy);
  return pedidos.filter(p=>diaTrabajo(p.fecha)===ayerKey());
}
function render(resaltar=[]){
  const hoy = pedidos.filter(p=>diaTrabajo(p.fecha)===hoyKey() && p.estado!=="Cancelado");
  $("#stCount").textContent = hoy.length;
  $("#stTotal").textContent = $fmt(hoy.reduce((s,p)=>s+Number(p.total||0),0));
  $("#stBurg").textContent = hoy.reduce((s,p)=>s+Number(p.hamburguesas||0),0);
  $("#hoyTxt").textContent = new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
  const L = visibles();
  $("#list").innerHTML = L.length ? L.map(p=>card(p, resaltar.includes(p.codigo))).join("")
    : `<div class="empty">${filtro==="activos" ? "No hay pedidos activos. Cuando entre uno, aparece acá con sonido." : "No hay pedidos para mostrar."}</div>`;
}
function card(p, nuevo){
  const deli = p.entrega==="delivery";
  const items = (p.items||[]).map(it=>`<div><b>${esc(it.q)}×</b> ${esc(it.n)}</div>`
    + (it.adds||[]).map(a=>`<div class="mod">+ ${esc(a[0])}</div>`).join("")
    + (it.opts||[]).map(o=>`<div class="mod">• ${esc(o)}</div>`).join("")).join("");
  return `<article class="card${nuevo?" nuevo":""}" style="border-left-color:${color(p.estado)}" data-c="${esc(p.codigo)}">
    <div class="c-top">
      <div><div class="c-num">#${esc(p.numero||"")}<small>${esc(p.codigo)}</small></div>
        <span class="chip ${deli?"deli":"take"}">${deli?"Delivery":"Take away"}</span>${p.canal==="mostrador"?'<span class="chip most">Mostrador</span>':p.canal==="pedidosya"?'<span class="chip py">PedidosYa</span>':p.canal==="rappi"?'<span class="chip rp">Rappi</span>':""}${(p.canal==="pedidosya"||p.canal==="rappi")&&p.referencia?` <span class="c-phone">${esc(p.referencia)}</span>`:""}</div>
      <div class="c-time">${hora(p.fecha)}<br>${new Date(p.fecha).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})}</div>
    </div>
    <div><div class="c-name">${esc(p.nombre||"-")}</div>${p.whatsapp?`<div class="c-phone">${esc(p.whatsapp)}</div>`:""}</div>
    ${deli?`<div class="c-addr">📍 ${esc(p.direccion)}${p.entre?`<br><span class="c-phone">Entre ${esc(p.entre)}</span>`:""}${p.referencia?`<br><span class="c-phone">${esc(p.referencia)}</span>`:""}<br><span class="c-phone">${esc(p.zona)} · ${$fmt(p.envio)}</span></div>`:""}
    <div class="c-items">${items}</div>
    ${p.aclaraciones?`<div class="c-notes"><b>Aclaraciones:</b> ${esc(p.aclaraciones)}</div>`:""}
    ${preciosOk(p)?"":`<div class="c-notes" style="background:#ffe3e8;color:#A52A3D"><b>⚠ Revisar precios:</b> no coinciden con el menú actual. Confirmá el total antes de cobrar.</div>`}
    <div class="c-tot"><span>${esc(p.pago)}${p.abonaCon?` · abona con ${$fmt(p.abonaCon)}`:""}</span><b>${$fmt(p.total)}</b></div>
    <div class="c-act">
      <select class="estado" data-act="estado" style="background:${color(p.estado)}" aria-label="Estado">${ESTADOS.map(([e])=>`<option ${e===p.estado?"selected":""}>${e}</option>`).join("")}</select>
      <button class="pago ${p.pagado?"si":""}" data-act="pagado">${p.pagado?"✓ Pagó":"No pagó"}</button>
      <div class="print">
        <button class="btn sm" data-act="cocina" title="Comanda para la cocina, sin precios">🖨 Cocina</button>
        <button class="btn ghost sm" data-act="ticket" title="Ticket completo con datos y precios">🖨 Completo</button>
      </div>
    </div>
  </article>`;
}

/* ---------- control de precios contra el menú ---------- */
// Si alguien manipula la página para mandar un pedido con precios falsos, se marca en rojo.
let PRECIOS = {}, ZONA_PRECIO = {};
function armarPrecios(){
  PRECIOS = {};
  MENU.forEach(c=>c.items.forEach(it=>{ PRECIOS[it.n] = { it, a: Object.fromEntries((ADI[it.a]||[]).map(x=>[x[0],x])) }; }));
  ZONA_PRECIO = Object.fromEntries(ZONAS);
}
armarPrecios();
// El menú se lee de la planilla al abrir y cada 5 minutos, para que el control de precios esté al día.
function refrescarMenu(){ if (typeof cargarMenu!=="function") return; cargarMenu({fresco:true}).then(()=>{ armarPrecios(); if (!$("#app").classList.contains("hidden")) render(); }); }
refrescarMenu(); setInterval(refrescarMenu, 5*60e3);
function preciosOk(p){
  let sub = 0;
  for (const it of (p.items||[])) {
    const m = PRECIOS[it.n]; if (!m) return false;
    let u = precioCanal(m.it, p.canal);
    for (const a of (it.adds||[])) { if (!(a[0] in m.a)) return false; u += precioAdiCanal(m.a[a[0]], p.canal); }
    if (Number(it.u) !== u) return false;
    sub += u * Number(it.q);
  }
  const env = p.entrega==="delivery" ? (ZONA_PRECIO[p.zona] ?? -1) : 0;
  return sub === Number(p.subtotal) && Number(p.total) === sub + env;
}

/* ---------- acciones ---------- */
const pendientes = {};
async function cambiar(codigo, campo, valor){
  const p = pedidos.find(x=>x.codigo===codigo); if (!p) return;
  p[campo] = valor; pendientes[codigo] = { ...(pendientes[codigo]||{}), [campo]: valor };
  render();
  try {
    const r = await Api.actualizar(PIN, codigo, campo, valor);
    if (!r.ok) throw new Error(r.error);
    delete pendientes[codigo][campo];
    if (!Object.keys(pendientes[codigo]).length) delete pendientes[codigo];
  } catch(e) {
    delete pendientes[codigo]; cargar();
    alertaSuave("No se pudo guardar el cambio. Revisá la conexión.");
  }
}
function alertaSuave(t){ $("#live").classList.add("off"); $("#live span").textContent = t; }

$("#list").addEventListener("change", e=>{
  if (e.target.dataset.act!=="estado") return;
  cambiar(e.target.closest(".card").dataset.c, "estado", e.target.value);
});
$("#list").addEventListener("click", e=>{
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const c = b.closest(".card").dataset.c, p = pedidos.find(x=>x.codigo===c);
  if (b.dataset.act==="pagado") cambiar(c, "pagado", !p.pagado);
  if (b.dataset.act==="cocina") imprimir(p, "cocina");
  if (b.dataset.act==="ticket") imprimir(p, "ticket");
});
document.querySelectorAll(".tab[data-f]").forEach(t=>t.onclick = ()=>{
  filtro = t.dataset.f; document.querySelectorAll(".tab[data-f]").forEach(x=>x.classList.toggle("on", x===t)); render();
});
try { $("#autoPrint").checked = localStorage.getItem("bifa_autoprint")==="1"; } catch(e){}
$("#autoPrint").onchange = ()=>{ try { localStorage.setItem("bifa_autoprint", $("#autoPrint").checked?"1":"0"); } catch(e){} };

/* ---------- impresión 80 mm ---------- */
function imprimir(p, tipo){
  const deli = p.entrega==="delivery";
  let h = `<div class="tk">`;
  if (tipo==="cocina") {
    h += `<div class="xl">#${esc(p.numero||"")} · ${deli?"DELIVERY":"TAKE AWAY"}</div>
      <div class="c">${esc(p.nombre||"")} · ${hora(p.fecha)} · ${esc(p.codigo)}</div><hr>`;
    (p.items||[]).forEach(it=>{
      h += `<div class="it">${esc(it.q)} x ${esc(it.n)}</div>`;
      (it.adds||[]).forEach(a=>h += `<div class="md">+ ${esc(a[0])}</div>`);
      (it.opts||[]).forEach(o=>h += `<div class="md">* ${esc(o)}</div>`);
    });
    if (p.aclaraciones) h += `<div class="nota">${esc(p.aclaraciones)}</div>`;
    h += `<hr><div class="c">Total artículos: ${esc((p.items||[]).reduce((s,i)=>s+Number(i.q||0),0))}</div>`;
  } else {
    h += `<h3>EL BIFARDO</h3><div class="c">Sucursal ${esc(CONFIG.SUCURSAL)}</div><hr>
      <div class="xl">#${esc(p.numero||"")}</div><div class="c">Código ${esc(p.codigo)} · ${new Date(p.fecha).toLocaleString("es-AR",{hour12:false})}</div><hr>
      <div><b>Cliente:</b> ${esc(p.nombre||"-")}</div>${p.whatsapp?`<div><b>WhatsApp:</b> ${esc(p.whatsapp)}</div>`:""}`;
    if (deli) h += `<div><b>Delivery a:</b> ${esc(p.direccion)}</div>${p.entre?`<div><b>Entre:</b> ${esc(p.entre)}</div>`:""}${p.referencia?`<div><b>Ref:</b> ${esc(p.referencia)}</div>`:""}<div><b>Zona:</b> ${esc(p.zona)}</div>`;
    else h += `<div><b>Retira en el local</b></div>`;
    h += `<hr>`;
    (p.items||[]).forEach(it=>{
      h += `<div class="r"><span>${esc(it.q)} x ${esc(it.n)}</span><span>$${esc(Number(it.q)*Number(it.u))}</span></div>`;
      (it.adds||[]).forEach(a=>h += `<div class="md">+ ${esc(a[0])} ($${esc(a[1])})</div>`);
      (it.opts||[]).forEach(o=>h += `<div class="md">* ${esc(o)}</div>`);
    });
    if (p.aclaraciones) h += `<div class="nota">${esc(p.aclaraciones)}</div>`;
    h += `<hr><div class="r"><span>Subtotal</span><span>$${esc(p.subtotal)}</span></div>`;
    if (deli) h += `<div class="r"><span>Envío</span><span>$${esc(p.envio)}</span></div>`;
    h += `<div class="r" style="font-size:16px;font-weight:800"><span>TOTAL</span><span>$${esc(p.total)}</span></div>
      <div><b>Pago:</b> ${esc(p.pago)}${p.pagado?" (PAGADO)":""}</div>${p.abonaCon?`<div><b>Abona con:</b> $${esc(p.abonaCon)}</div>`:""}`;
  }
  h += `</div>`;
  $("#print").innerHTML = h;
  window.print();
}

/* ---------- resumen del turno ---------- */
function resumen(){
  const dia = $("#rDia").value, turno = $("#rTurno").value;
  const L = pedidos.filter(p=>{
    if (p.estado==="Cancelado" || diaTrabajo(p.fecha)!==dia) return false;
    const h = new Date(p.fecha).getHours();
    const noche = h >= 17 || h < 5;
    return turno==="todo" || (turno==="noche" ? noche : !noche);
  });
  const sum = f => L.reduce((s,p)=>s+Number(f(p)||0),0);
  const porPago = {}; L.forEach(p=>{ porPago[p.pago] = (porPago[p.pago]||0) + Number(p.total||0); });
  const delis = L.filter(p=>p.entrega==="delivery");
  const porCanal = {}; L.forEach(p=>{ const k = (CANALES[p.canal]||CANALES.web).nombre; porCanal[k] = porCanal[k]||{n:0,t:0}; porCanal[k].n++; porCanal[k].t += Number(p.total||0); });
  const total = sum(p=>p.total), env = sum(p=>p.envio), burg = sum(p=>p.hamburguesas);
  $("#rBody").innerHTML = `
    <div class="row"><span>Pedidos</span><b>${L.length}</b></div>
    ${Object.entries(porCanal).map(([k,v])=>`<div class="row"><span>· ${esc(k)}</span><b>${v.n} · ${$fmt(v.t)}</b></div>`).join("")}
    <div class="row"><span>Delivery / Take away</span><b>${delis.length} / ${L.length-delis.length}</b></div>
    <div class="row"><span>Hamburguesas</span><b>${burg}</b></div>
    ${Object.entries(porPago).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${$fmt(v)}</b></div>`).join("")}
    <div class="row"><span>Envíos cobrados</span><b>${$fmt(env)}</b></div>
    <div class="row"><span>Pendientes de pago</span><b>${L.filter(p=>!p.pagado).length}</b></div>
    <div class="row big"><span>Total</span><span>${$fmt(total)}</span></div>`;
  const d = new Date(dia+"T12:00:00");
  $("#rTxt").textContent =
`FECHA: ${d.getDate()}.${d.getMonth()+1}
TURNO: ${turno==="mediodia"?"mediodía":turno==="noche"?"noche":"día completo"}
PEDIDOS (sistema propio): ${L.length}
${Object.entries(porCanal).map(([k,v])=>`  ${k}: ${v.n} pedidos · ${v.t.toLocaleString("es-AR")}`).join("\n")}
Burger totales: ${burg}
Ingreso total: ${total.toLocaleString("es-AR")}
${Object.entries(porPago).map(([k,v])=>`${k}: ${v.toLocaleString("es-AR")}`).join("\n")}
Envíos: ${env.toLocaleString("es-AR")}`;
}
$("#btnResumen").onclick = ()=>{
  $("#rDia").value = hoyKey();
  $("#rTurno").value = new Date().getHours() >= 17 || new Date().getHours() < 5 ? "noche" : "mediodia";
  resumen(); $("#mRes").classList.remove("hidden");
};
$("#rDia").onchange = resumen; $("#rTurno").onchange = resumen;
$("#rClose").onclick = ()=>$("#mRes").classList.add("hidden");
$("#mRes").addEventListener("click", e=>{ if (e.target.id==="mRes") $("#mRes").classList.add("hidden"); });
$("#rCopy").onclick = async ()=>{
  try { await navigator.clipboard.writeText($("#rTxt").textContent); $("#rCopy").textContent="¡Copiado!"; }
  catch(e){ $("#rCopy").textContent="Seleccioná el texto y copialo"; }
  setTimeout(()=>$("#rCopy").textContent="Copiar resumen",2000);
};


/* ================== VISTAS: Pedidos / Menú ================== */
let vista = "pedidos";
document.querySelectorAll(".vtab").forEach(b=>b.onclick = ()=>{
  if (vista === "menu" && b.dataset.v !== "menu" && meSucio && !confirm_("Tenés cambios del menú sin guardar. ¿Salir igual?")) return;
  vista = b.dataset.v;
  document.querySelectorAll(".vtab").forEach(x=>x.classList.toggle("on", x===b));
  $("#pedidosView").classList.toggle("hidden", vista!=="pedidos");
  $("#menuView").classList.toggle("hidden", vista!=="menu");
  if (vista==="menu" && !ME) cargarEditor();
});
// confirm() está bloqueado en algunos navegadores embebidos: si falla, se deja salir.
function confirm_(t){ try { return window.confirm(t); } catch(e) { return true; } }
window.addEventListener("beforeunload", e=>{ if (meSucio) { e.preventDefault(); e.returnValue = ""; } });

/* ================== EDITOR DE MENÚ ================== */
// ME = copia editable del menú completo (incluye productos ocultos). ORIG = lo último guardado.
let ME = null, ORIG = null, meSucio = false, meSub = "productos";
const LISTAS_ADI = { FULL: "Hamburguesas con papas", VEG: "Veggies", HUERF: "Huérfanas (sin papas)", PAPAS: "Papas y entradas" };
const DIAS_TXT = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const num = v => { const n = Math.round(Number(String(v).replace(/[^\d]/g,""))); return n > 0 ? n : 0; };

async function cargarEditor(){
  $("#meBody").innerHTML = `<p class="me-help">Cargando el menú…</p>`;
  let d;
  try {
    if (Api.usaLocal()) d = { ok:true, menu: JSON.parse(JSON.stringify(MENU)).map(c=>({...c, items:c.items.map(i=>({...i, show:true}))})), adi: JSON.parse(JSON.stringify(ADI)), zonas: JSON.parse(JSON.stringify(ZONAS)) };
    else d = await Api.menuCompleto(PIN);
    if (!d.ok) throw new Error(d.error);
  } catch(e) { $("#meBody").innerHTML = `<p class="me-help">No se pudo cargar el menú: ${esc(e.message||"sin conexión")}. Probá de nuevo en un momento.</p>`; return; }
  // normalizar adicionales a [nombre, local, pedidosya, rappi]
  Object.values(d.adi||{}).forEach(l=>l.forEach(a=>{ while (a.length < 4) a.push(0); }));
  ME = d; ORIG = JSON.stringify({menu:d.menu, adi:d.adi, zonas:d.zonas});
  setSucio(false); renderEditor();
}
function setSucio(v){
  meSucio = v;
  $("#meGuardar").disabled = !v; $("#meDescartar").disabled = !v;
  $("#meEstado").textContent = v ? "Hay cambios sin guardar" : "Sin cambios";
  $("#meEstado").style.color = v ? "var(--red-dark)" : "";
}
document.querySelectorAll(".tab[data-m]").forEach(t=>t.onclick = ()=>{
  meSub = t.dataset.m; document.querySelectorAll(".tab[data-m]").forEach(x=>x.classList.toggle("on", x===t));
  $("#meBuscar").classList.toggle("hidden", meSub!=="productos"); renderEditor();
});
$("#meBuscar").addEventListener("input", ()=>{
  const q = $("#meBuscar").value.trim().toLowerCase();
  document.querySelectorAll("#meBody .me-row[data-busca]").forEach(r=>r.style.display = !q || r.dataset.busca.includes(q) ? "" : "none");
});
const inp = (path, val, opts={}) => `<input ${opts.type==="text"?'type="text"':'type="number" min="0" step="100" inputmode="numeric"'} data-p="${path}" value="${esc(val||"")}" ${opts.ph!=null?`placeholder="${esc(opts.ph)}"`:""} aria-label="${esc(opts.lbl||"")}">`;
const cel = (lbl, html) => `<div data-lbl="${esc(lbl)}">${html}</div>`;

function renderEditor(){
  if (!ME) return;
  const help = {
    productos: "Cambiá precios, stock y visibilidad. <b>PedidosYa</b> y <b>Rappi</b> vacíos = mismo precio que en el local. <b>Sin stock</b> lo muestra pero no se puede pedir; <b>Visible</b> apagado lo oculta. Tocá ⋯ para descripción y combo del día. Los cambios se aplican al tocar <b>Guardar cambios</b>.",
    adicionales: "Precio de cada adicional según el tipo de producto. PedidosYa y Rappi vacíos = mismo precio que en el local.",
    zonas: "Costo del envío por distancia (solo pedidos web con delivery).",
  }[meSub];
  $("#meHelp").innerHTML = help;
  let h = "";
  if (meSub === "productos") {
    ME.menu.forEach((c,ci)=>{
      h += `<div class="me-cat"><h3>${esc(c.cat)}</h3>
        <div class="me-head"><span>Producto</span><span>Local</span><span>Tachado</span><span>PedidosYa</span><span>Rappi</span><span style="text-align:center">Sin stock</span><span style="text-align:center">Visible</span><span></span></div>`;
      c.items.forEach((it,ii)=>{
        const P = `m.${ci}.${ii}`;
        h += `<div class="me-row${it.show===false?" oculto":""}" data-busca="${esc(it.n.toLowerCase())}" data-row="${P}">
          ${cel("Producto", inp(P+".n", it.n, {type:"text", lbl:"Nombre"}))}
          ${cel("Local", inp(P+".p", it.p, {lbl:"Precio local"}))}
          ${cel("Tachado", inp(P+".old", it.old, {ph:"—", lbl:"Precio tachado"}))}
          ${cel("PedidosYa", inp(P+".py", it.py, {ph:it.p, lbl:"Precio PedidosYa"}))}
          ${cel("Rappi", inp(P+".rp", it.rp, {ph:it.p, lbl:"Precio Rappi"}))}
          <label class="sw" data-lbl="Sin stock"><input type="checkbox" class="stock" data-p="${P}.out" ${it.out?"checked":""} aria-label="Sin stock"></label>
          <label class="sw" data-lbl="Visible"><input type="checkbox" data-p="${P}.show" ${it.show!==false?"checked":""} aria-label="Visible"></label>
          <button class="me-x" data-more="${P}" title="Descripción y combo" aria-label="Más opciones">⋯</button>
          <div class="me-more hidden" id="more-${ci}-${ii}">
            <textarea rows="2" data-p="${P}.d" placeholder="Descripción" aria-label="Descripción">${esc(it.d||"")}</textarea>
            <select data-p="${P}.combo" aria-label="Combo del día"><option value="">Todos los días</option>${DIAS_TXT.map((d,i)=>`<option value="${i}" ${it.combo===i?"selected":""}>Solo ${d}</option>`).join("")}</select>
          </div>
        </div>`;
      });
      h += `<button class="me-add" data-addprod="${ci}">+ Agregar producto en ${esc(c.cat)}</button></div>`;
    });
  } else if (meSub === "adicionales") {
    Object.keys(ME.adi).forEach(l=>{
      h += `<div class="me-cat"><h3>${esc(LISTAS_ADI[l]||l)}</h3>
        <div class="me-head" style="grid-template-columns:minmax(200px,2.4fr) repeat(3,minmax(86px,1fr)) 34px"><span>Adicional</span><span>Local</span><span>PedidosYa</span><span>Rappi</span><span></span></div>`;
      ME.adi[l].forEach((a,ai)=>{
        const P = `a.${l}.${ai}`;
        h += `<div class="me-row" style="grid-template-columns:minmax(200px,2.4fr) repeat(3,minmax(86px,1fr)) 34px">
          ${cel("Adicional", inp(P+".0", a[0], {type:"text", lbl:"Nombre"}))}
          ${cel("Local", inp(P+".1", a[1], {lbl:"Precio local"}))}
          ${cel("PedidosYa", inp(P+".2", a[2]||"", {ph:a[1], lbl:"Precio PedidosYa"}))}
          ${cel("Rappi", inp(P+".3", a[3]||"", {ph:a[1], lbl:"Precio Rappi"}))}
          <button class="me-x" data-deladi="${l}.${ai}" title="Quitar" aria-label="Quitar adicional">✕</button>
        </div>`;
      });
      h += `<button class="me-add" data-addadi="${esc(l)}">+ Agregar adicional</button></div>`;
    });
  } else {
    h += `<div class="me-cat" style="max-width:560px"><div class="me-head" style="grid-template-columns:2fr 1fr 34px"><span>Zona</span><span>Precio</span><span></span></div>`;
    ME.zonas.forEach((z,zi)=>{
      h += `<div class="me-row" style="grid-template-columns:2fr 1fr 34px">
        ${cel("Zona", inp(`z.${zi}.0`, z[0], {type:"text", lbl:"Zona"}))}
        ${cel("Precio", inp(`z.${zi}.1`, z[1], {lbl:"Precio"}))}
        <button class="me-x" data-delzona="${zi}" title="Quitar" aria-label="Quitar zona">✕</button></div>`;
    });
    h += `<button class="me-add" data-addzona="1">+ Agregar zona</button></div>`;
  }
  $("#meBody").innerHTML = h;
  $("#meBuscar").dispatchEvent(new Event("input"));
}

// editar un valor del modelo según su ruta (m.cat.item.campo | a.lista.i.k | z.i.k)
function setPath(path, el){
  const [t, x, y, k] = path.split(".");
  if (t === "m") {
    const it = ME.menu[+x].items[+y];
    if (k === "n" || k === "d") it[k] = el.value;
    else if (k === "out") it.out = el.checked;
    else if (k === "show") { it.show = el.checked; el.closest(".me-row").classList.toggle("oculto", !el.checked); }
    else if (k === "combo") { if (el.value === "") delete it.combo; else it.combo = +el.value; }
    else { const n = num(el.value); if (n) it[k] = n; else delete it[k]; if (k==="p") el.closest(".me-row").querySelectorAll('[data-p$=".py"],[data-p$=".rp"]').forEach(i=>i.placeholder = n||""); }
  } else if (t === "a") {
    const a = ME.adi[x][+y]; a[+k] = +k === 0 ? el.value : num(el.value);
  } else if (t === "z") {
    const z = ME.zonas[+x]; z[+k] = +k === 0 ? el.value : num(el.value);
  }
  const row = el.closest(".me-row"); if (row) row.classList.add("cambiado");
  setSucio(JSON.stringify({menu:ME.menu, adi:ME.adi, zonas:ME.zonas}) !== ORIG);
}
$("#meBody").addEventListener("input", e=>{ if (e.target.dataset.p) setPath(e.target.dataset.p, e.target); });
$("#meBody").addEventListener("change", e=>{ if (e.target.dataset.p && (e.target.type==="checkbox" || e.target.tagName==="SELECT")) setPath(e.target.dataset.p, e.target); });
$("#meBody").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.more) { const [,ci,ii] = b.dataset.more.split("."); $(`#more-${ci}-${ii}`).classList.toggle("hidden"); return; }
  if (b.dataset.addprod != null) {
    const c = ME.menu[+b.dataset.addprod], base = c.items[0] || {};
    // el producto nuevo hereda los adicionales y opcionales del primero de la categoría
    c.items.push({ n: "NUEVO PRODUCTO", p: base.p || 0, a: base.a, o: base.o ? base.o.slice() : undefined, show: true });
  }
  if (b.dataset.addadi) ME.adi[b.dataset.addadi].push(["NUEVO ADICIONAL", 0, 0, 0]);
  if (b.dataset.deladi) { const [l,i] = b.dataset.deladi.split("."); ME.adi[l].splice(+i,1); }
  if (b.dataset.addzona) ME.zonas.push(["NUEVA ZONA", 0]);
  if (b.dataset.delzona != null) ME.zonas.splice(+b.dataset.delzona,1);
  setSucio(JSON.stringify({menu:ME.menu, adi:ME.adi, zonas:ME.zonas}) !== ORIG);
  renderEditor();
  if (b.dataset.addprod != null) { const rows = $("#meBody").querySelectorAll(`[data-row^="m.${b.dataset.addprod}."]`); const last = rows[rows.length-1]; if (last) { last.scrollIntoView({block:"center"}); last.querySelector("input").select(); } }
});
$("#meDescartar").onclick = ()=>{ const o = JSON.parse(ORIG); ME.menu = o.menu; ME.adi = o.adi; ME.zonas = o.zonas; setSucio(false); renderEditor(); };
$("#meGuardar").onclick = async ()=>{
  // validar antes de mandar
  const malos = [];
  ME.menu.forEach(c=>c.items.forEach(it=>{ if (!String(it.n||"").trim() || !(it.p > 0)) malos.push(it.n || "(sin nombre)"); }));
  if (malos.length) { $("#meEstado").textContent = "Falta nombre o precio en: " + malos.slice(0,3).join(", "); $("#meEstado").style.color = "var(--red-dark)"; return; }
  $("#meGuardar").disabled = true; $("#meEstado").textContent = "Guardando…";
  try {
    if (Api.usaLocal()) {
      aplicarMenu({ menu: ME.menu.map(c=>({ cat:c.cat, items:c.items.filter(i=>i.show!==false) })), adi: ME.adi, zonas: ME.zonas });
    } else {
      const r = await Api.guardarMenu(PIN, { menu: ME.menu, adi: ME.adi, zonas: ME.zonas });
      if (!r.ok) throw new Error(r.error);
    }
    ORIG = JSON.stringify({menu:ME.menu, adi:ME.adi, zonas:ME.zonas});
    setSucio(false); renderEditor();
    $("#meEstado").textContent = "✓ Guardado. La página de pedidos ya muestra los cambios (puede tardar hasta 1 minuto).";
    $("#meEstado").style.color = "var(--s-prep)";
    refrescarMenu();
  } catch(e) {
    $("#meGuardar").disabled = false;
    $("#meEstado").textContent = "No se pudo guardar: " + (e.message || "sin conexión") + ". Probá de nuevo.";
    $("#meEstado").style.color = "var(--red-dark)";
  }
};

if (Api.usaLocal()) { $("#loginErr").textContent = "Modo prueba: los pedidos se guardan solo en este navegador. Entrá con cualquier PIN."; }
</script>
